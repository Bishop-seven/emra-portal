# ═══════════════════════════════════════════════════════
# Keep-alive de Supabase — evita la pausa por inactividad del plan Free
# Guardar en el repo del portal como: .github/workflows/keepalive.yml
# GitHub lo ejecuta solo — no requiere servidor ni configuración extra.
# ═══════════════════════════════════════════════════════
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 */2 * *'   # cada 2 días a las 12:00 UTC (Supabase Free pausa a los ~7 días)
  workflow_dispatch:          # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de datos EMRA
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://tjoveoqolrfxntvvdjwh.supabase.co/rest/v1/iniciativas?select=id&limit=1" \
            -H "apikey: sb_publishable_CC2mhTuNvau_uoo9myThCw_7milAiHE" \
            -H "Authorization: Bearer sb_publishable_CC2mhTuNvau_uoo9myThCw_7milAiHE")
          echo "Supabase respondió con HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠ La base de datos no respondió 200 — revisar el proyecto en Supabase"
            exit 1
          fi
