name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de datos EMRA
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://tjoveoqolrfxntvvdjwh.supabase.co/rest/v1/iniciativas?select=id&limit=1" -H "apikey: sb_publishable_CC2mhTuNvau_uoo9myThCw_7milAiHE" -H "Authorization: Bearer sb_publishable_CC2mhTuNvau_uoo9myThCw_7milAiHE")
          echo "Supabase respondio con HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "La base de datos no respondio 200 - revisar Supabase"
            exit 1
          fi
