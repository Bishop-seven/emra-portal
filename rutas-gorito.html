<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rutas de Gorito · EMRA</title>
<meta name="description" content="Gorito recorre la Región de Antofagasta siguiendo el viaje del cobre y del litio, con las iniciativas de la EMRA en el mapa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@600&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#121a33; --gris:#5a6178;
  --oe1:#FAA900; --oe2:#70AD57; --oe3:#FF5812; --oe4:#0090D4; --oe5:#00BCB6;
  --cobre:#c8743d; --litio:#38b6c9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fcdef;font-family:'Nunito',system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:var(--tinta)}

/* Cielo (día y noche) */
#cielo{position:fixed;inset:0;background:linear-gradient(#4aa6de 0%,#8ccbee 50%,#cbe9f7 100%);overflow:hidden}
#cielo::before{content:"";position:absolute;inset:0;background:linear-gradient(#081127 0%,#16234a 55%,#2b3b6e 100%);opacity:var(--noche,0)}
#cielo::after{content:"";position:absolute;inset:0;opacity:var(--noche,0);
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 28% 8%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 44% 22%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 63% 12%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 78% 26%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 6%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 6% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 53% 33%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 37% 40%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 94% 38%,#fff 50%,transparent 51%)}
.sol{position:absolute;right:7%;top:7%;width:64px;height:64px;border-radius:50%;background:#fff3c4;box-shadow:0 0 0 10px rgba(255,243,196,.3);z-index:1;transition:background .8s,box-shadow .8s}
body.noche .sol{background:#eef1ff;box-shadow:inset -14px -6px 0 #c9d0ea,0 0 0 10px rgba(238,241,255,.08)}
.nube{position:absolute;width:12px;height:12px;opacity:calc(.95 - var(--noche,0)*.75);animation:nube linear infinite;z-index:1}
.nube::before{content:"";position:absolute;width:12px;height:12px;background:#fff;
  box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,48px 0 #fff,12px -12px #fff,24px -12px #fff,36px -12px #fff,24px -24px #fff,60px 0 #fff,-12px 0 #fff}
.n1{top:24%;left:-120px;animation-duration:70s}
.n2{top:14%;left:-120px;animation-duration:95s;animation-delay:-40s;transform:scale(.7)}
.n3{top:32%;left:-120px;animation-duration:120s;animation-delay:-90s;transform:scale(1.2)}
@keyframes nube{to{left:110%}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* Arriba: cartel + barra de rutas y filtros */
#arriba{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 32px));z-index:3;pointer-events:none}
#arriba > *{pointer-events:auto}
#cartel{background:var(--tinta);border-top:6px solid var(--oe3);color:#fff;text-align:center;padding:12px 16px 10px;box-shadow:0 6px 0 rgba(18,26,51,.25)}
#cartel h1{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(20px,5vw,34px);letter-spacing:.06em;margin:0;line-height:1.05}
#cartel p{font-family:'IBM Plex Mono',monospace;color:var(--oe1);margin:5px 0 0;font-size:clamp(12px,3.2vw,16px)}
#cartel.cambia{animation:cartel .45s ease}
@keyframes cartel{0%{transform:translateY(-10px)}100%{transform:none}}
#barra{display:flex;gap:8px;align-items:center;margin-top:8px}
.seg{display:flex;flex:none;background:#fff;border:2px solid var(--tinta);border-radius:10px;overflow:hidden;box-shadow:0 3px 0 var(--tinta)}
.seg button{border:0;background:none;font-weight:900;font-size:13px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.seg button + button{border-left:2px solid var(--tinta)}
.seg button.on{background:var(--tinta);color:#fff}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 2px 6px;margin-bottom:-4px}
#chips::-webkit-scrollbar{display:none}
.cf{flex:none;display:flex;gap:5px;align-items:center;border:2px solid var(--tinta);border-radius:999px;background:#fff;font-weight:800;font-size:12px;padding:4px 9px 4px 6px;cursor:pointer;box-shadow:0 2px 0 var(--tinta);white-space:nowrap}
.cf i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cf.on{background:var(--c,var(--tinta));color:var(--tinta)}
.cf[data-oe="0"].on{background:var(--tinta);color:#fff}
.cf:disabled{opacity:.4;cursor:default}
.boton{flex:none;width:34px;height:34px;border:2px solid var(--tinta);border-radius:10px;background:#fff;font-size:16px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--tinta);display:grid;place-items:center}
#oeTxt{margin-top:8px;background:rgba(255,255,255,.95);border:2px solid var(--tinta);border-left:8px solid var(--c);border-radius:10px;padding:6px 10px;font-weight:700;font-size:12.5px;line-height:1.35}
#oeTxt[hidden]{display:none}

/* Diálogo de Gorito (abajo) */
#dialogo{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;
  width:min(680px,calc(100% - 32px));background:#fff;border:3px solid var(--tinta);box-shadow:0 6px 0 var(--tinta);border-radius:16px;
  display:grid;grid-template-columns:86px 1fr;gap:6px 14px;padding:12px 14px 12px 10px}
#dialogo img{width:86px;height:auto;grid-row:1 / span 2;align-self:end;margin-bottom:-4px;transform-origin:50% 100%}
.habla{animation:habla .35s ease-in-out infinite alternate}
@keyframes habla{to{transform:translateY(-3px) rotate(-2deg)}}
.dtxt{min-height:72px;cursor:pointer;padding-right:36px}
#dNombre{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--oe4);margin:2px 0 2px}
#dTexto{margin:0;font-size:clamp(15px,3.8vw,18px);line-height:1.38;font-weight:700}
#dFuente{margin:6px 0 0;font-size:12px;color:var(--gris);font-weight:600}
#dFuente:empty{display:none}
#dPin{margin-top:8px;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--tinta);background:#f5f7fb;border-radius:999px;
  padding:5px 12px 5px 8px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--tinta)}
#dPin[hidden]{display:none}
#dPin:hover{background:#fff}
#dPin i{width:12px;height:12px;border-radius:3px;background:var(--c)}
#sonido{position:absolute;top:8px;right:10px}
#sonido[aria-pressed="false"]{opacity:.55}
nav{grid-column:2;display:flex;align-items:center;gap:10px;justify-content:space-between}
nav button{font-weight:900;font-size:14px;border:2px solid var(--tinta);border-radius:10px;background:#fff;padding:7px 12px;cursor:pointer;box-shadow:0 3px 0 var(--tinta);white-space:nowrap}
nav button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tinta)}
nav button:disabled{opacity:.35;cursor:default}
#sig{background:var(--oe1)}
#puntos{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#puntos button{width:10px;height:10px;padding:0;border-radius:3px;box-shadow:none;background:#d7dbe6;border:0}
#puntos button.on{background:var(--oe3)}
#cuenta{display:none;font-weight:900;font-size:13px;color:var(--gris)}

/* Pines HTML sobre el mapa */
#pines{position:fixed;inset:0;pointer-events:none;z-index:2}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:#fff;border:2px solid var(--tinta);border-radius:999px;padding:3px 9px 3px 5px;font-weight:800;font-size:12px;
  cursor:pointer;box-shadow:0 3px 0 var(--tinta);transform:translate(-50%,-100%)}
.pin i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.pin b{font-weight:900;background:var(--tinta);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;line-height:16px}
.pin.chico span{display:none}
.pin.chico{padding:3px 4px 3px 5px}
.pin.activo{animation:salta .9s ease-in-out infinite;z-index:1}
.pin[hidden]{display:none}
@keyframes salta{50%{margin-top:-6px}}

/* Ventanas (lista, ficha, desafío, sello) */
.capa{position:fixed;inset:0;background:rgba(18,26,51,.5);display:grid;place-items:center;padding:16px;z-index:6}
.capa[hidden]{display:none}
.tarjeta{position:relative;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border:3px solid var(--tinta);border-radius:16px;box-shadow:0 6px 0 var(--tinta);padding:18px 18px 16px;border-top:10px solid var(--c,var(--tinta))}
.cerrar{position:absolute;top:8px;right:10px;border:0;background:none;font:900 26px/1 'Nunito';cursor:pointer}
.chip{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.04em;color:var(--tinta);background:var(--c);border-radius:6px;padding:3px 8px;margin-right:4px}
.chip.gris{background:#e6e9f1}
.tarjeta h2{margin:10px 0 2px;font-size:21px;line-height:1.2;font-weight:900;padding-right:24px}
.tarjeta .sub{margin:0 0 12px;color:var(--gris);font-weight:700}
.barra{height:12px;background:#e6e9f1;border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--c);width:0;transition:width .8s ease}
.avtxt{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin:6px 0 12px}
.dato{font-size:14px;margin:0 0 10px;line-height:1.4}
.dato b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.foto{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:2px solid var(--tinta);margin:4px 0 12px;background:#eef1f6}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px;background:var(--oe1);border:2px solid var(--tinta);border-radius:10px;padding:8px 12px;text-decoration:none;box-shadow:0 3px 0 var(--tinta);cursor:pointer;color:var(--tinta)}
.btn.blanco{background:#fff}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nota{font-size:11px;color:#8a90a3;margin:12px 0 0}
.gline{display:flex;gap:10px;align-items:center;background:#f5f7fb;border-radius:12px;padding:8px 10px;margin:8px 0 12px;font-weight:800;font-size:14px;line-height:1.3}
.gline img{width:46px;flex:none}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lista button{width:100%;text-align:left;background:#fff;border:2px solid var(--tinta);border-radius:12px;padding:8px 10px;cursor:pointer;box-shadow:0 2px 0 var(--tinta);display:grid;gap:4px}
.lista button:hover{background:#fafbfe}
.lista .nom{font-weight:900;font-size:14px;line-height:1.25}
.lista .meta{font-size:12px;color:var(--gris);font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lista .mini{height:6px;background:#e6e9f1;border-radius:3px;overflow:hidden}
.lista .mini i{display:block;height:100%;background:var(--c)}
.grupo{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:12px 0 6px}
/* Desafío */
.pregunta{font-size:18px;font-weight:900;line-height:1.3;margin:10px 0 14px}
.opciones{display:grid;gap:8px}
.opciones button{text-align:left;font-weight:800;font-size:15px;background:#fff;border:2px solid var(--tinta);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--tinta)}
.opciones button.bien{background:#c9f0d2}
.opciones button.mal{background:#ffd3c8}
.opciones button:disabled{cursor:default}
.explica{margin:12px 0 0;font-size:13.5px;font-weight:700;line-height:1.4}
.explica small{display:block;color:var(--gris);font-weight:600;margin-top:4px}
/* Sello */
.sello{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff6,transparent 45%),var(--c);border:6px solid var(--tinta);box-shadow:0 6px 0 var(--tinta),inset 0 0 0 8px #fff5;animation:sello .7s cubic-bezier(.2,1.6,.4,1)}
.sello img{width:96px;margin-top:-6px}
.sello span{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;font:700 12px 'Silkscreen',monospace;padding:4px 10px;border-radius:6px;white-space:nowrap}
@keyframes sello{0%{transform:scale(.2) rotate(-30deg)}100%{transform:none}}
.centro{text-align:center}
#aviso{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--tinta);color:#fff;font-weight:800;padding:10px 16px;border-radius:10px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none}
#aviso.ver{opacity:1}

#cargando{position:fixed;inset:0;display:grid;place-items:center;font:700 16px 'Silkscreen',monospace;color:#fff;letter-spacing:.1em}

@media (max-width:560px){
  #dialogo{grid-template-columns:62px 1fr;padding:10px 10px 10px 8px;gap:4px 10px}
  #dialogo img{width:62px}
  nav button{padding:6px 9px;font-size:13px}
  #puntos{display:none}
  #cuenta{display:block}
  .seg button{padding:6px 8px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .nube,.pin.activo,.habla,.sello{animation:none}
}
</style>
<script src="rutas-gorito/ruta-datos.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="cielo" aria-hidden="true"><div class="sol"></div><div class="nube n1"></div><div class="nube n2"></div><div class="nube n3"></div></div>
<div id="cargando">CARGANDO…</div>
<canvas id="c" aria-label="Mapa voxel de la Región de Antofagasta con las rutas del cobre y del litio"></canvas>
<div id="pines"></div>

<div id="arriba">
  <header id="cartel"><h1 id="cTit">RUTA DEL COBRE</h1><p id="cSub">Región de Antofagasta · Chile</p></header>
  <div id="barra">
    <div class="seg" role="tablist" aria-label="Ruta">
      <button id="rCobre" role="tab">Cobre</button><button id="rLitio" role="tab">Litio</button>
    </div>
    <div id="chips" aria-label="Filtrar iniciativas por objetivo estratégico"></div>
    <button class="boton" id="bNoche" aria-label="Ver de noche" title="Ver de noche">🌙</button>
  </div>
  <p id="oeTxt" hidden></p>
</div>

<section id="dialogo" aria-live="polite">
  <button class="boton" id="sonido" aria-pressed="true" aria-label="Silenciar a Gorito" title="Silenciar a Gorito">🔊</button>
  <img id="dGorito" src="gorito.webp" alt="Gorito">
  <div class="dtxt" id="dTxt" title="Toca para ver todo el texto">
    <p id="dNombre">Gorito</p>
    <p id="dTexto"></p>
    <p id="dFuente"></p>
    <button id="dPin" hidden></button>
  </div>
  <nav>
    <button id="ant" aria-label="Parada anterior">◀</button>
    <div id="puntos" aria-label="Paradas"></div><span id="cuenta" aria-hidden="true"></span>
    <button id="sig">Siguiente ▶</button>
  </nav>
</section>

<div class="capa" id="vLista" hidden role="dialog" aria-modal="true" aria-labelledby="lTit">
  <div class="tarjeta" id="lCard">
    <button class="cerrar" data-cierra aria-label="Cerrar">×</button>
    <h2 id="lTit"></h2>
    <div class="gline"><img src="gorito.webp" alt=""><span id="lGor"></span></div>
    <div id="lCuerpo"></div>
    <p class="nota">Ubicación aproximada por territorio. Corto plazo: cartera de la Plataforma de gestión. Mediano plazo: iniciativas del Portal EMRA.</p>
  </div>
</div>

<div class="capa" id="vFicha" hidden role="dialog" aria-modal="true" aria-labelledby="fNom">
  <div class="tarjeta" id="fCard">
    <button class="cerrar" data-cierra aria-label="Cerrar">×</button>
    <div id="fChips"></div>
    <h2 id="fNom"></h2>
    <p class="sub" id="fZona"></p>
    <div id="fCuerpo"></div>
    <div class="acciones" id="fAcc"></div>
  </div>
</div>

<div class="capa" id="vQuiz" hidden role="dialog" aria-modal="true" aria-labelledby="qTit">
  <div class="tarjeta" id="qCard">
    <button class="cerrar" data-cierra aria-label="Cerrar">×</button>
    <span class="chip" id="qNum"></span>
    <h2 id="qTit">Desafío Gorito</h2>
    <p class="pregunta" id="qPre"></p>
    <div class="opciones" id="qOps"></div>
    <p class="explica" id="qExp" hidden></p>
    <div class="acciones"><button class="btn" id="qSig" hidden>Siguiente pregunta ▶</button></div>
  </div>
</div>

<div class="capa" id="vSello" hidden role="dialog" aria-modal="true" aria-labelledby="sTit">
  <div class="tarjeta centro" id="sCard">
    <button class="cerrar" data-cierra aria-label="Cerrar">×</button>
    <div class="sello"><img src="gorito.webp" alt=""><span id="sNom"></span></div>
    <h2 id="sTit" style="padding:0;margin-top:22px"></h2>
    <p class="sub" id="sPts"></p>
    <div class="acciones" style="justify-content:center">
      <button class="btn" id="sCompartir">Compartir</button>
      <button class="btn blanco" id="sOtra"></button>
      <button class="btn blanco" data-cierra>Ver el mapa</button>
    </div>
  </div>
</div>
<div id="aviso" role="status"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═════════ Datos ═════════ */
const OEC = {1:'#FAA900',2:'#70AD57',3:'#FF5812',4:'#0090D4',5:'#00BCB6'};
// Textos literales de emra.cl («Objetivos Estratégicos · Pilares de la EMRA 2023-2050»), igual que en videos-home.html.
const OBJ = {
  1:{corto:'Mejorar la calidad de vida', url:'https://www.emra.cl/web/oe1-mejorar-la-calidad-de-vida/',
     t:'OE1: Mejorar la calidad de vida de todas las comunidades y pueblos indígenas de la Región de Antofagasta.'},
  2:{corto:'Minería sustentable', url:'https://www.emra.cl/web/oe2-mineria-sustentable/',
     t:'OE2: Minería sustentable, que contemple la rehabilitación y preservación del patrimonio natural y cultural.'},
  3:{corto:'Fortalecer las empresas regionales', url:'https://www.emra.cl/web/oe3-fortalecer-las-empresas-regionales/',
     t:'OE3: Incentivar la creación y fortalecer las empresas regionales para aumentar su participación en la cadena de valor de la minería, con una perspectiva descentralizada.'},
  4:{corto:'Mejorar la institucionalidad pública', url:'https://www.emra.cl/web/oe4-mejorar-la-institucionalidad-publica/',
     t:'OE4: Mejorar la institucionalidad pública y la gobernanza para un sector minero más competitivo y sostenible.'},
  5:{corto:'Reforzar el ecosistema del conocimiento', url:'https://www.emra.cl/web/oe5_reforzar_ecosistema_del_conocimiento/',
     t:'OE5: Reforzar el ecosistema del conocimiento. y la innovación en la cadena del valor minero.'},
};
const DATOS = window.RUTA_DATOS || {corto:[], mediano:[]};
const todas = () => [...DATOS.corto.map(x=>({...x,plazo:'corto'})), ...DATOS.mediano.map(x=>({...x,plazo:'mediano'}))];
let INI = todas();

// Territorios: un pin por territorio (lat/lng de referencia; «Toda la región» va al centro del mapa).
const TERR = [
  {k:'antofagasta',  n:'Antofagasta',          lat:-23.64, lng:-70.37},
  {k:'tocopilla',    n:'Tocopilla',            lat:-22.09, lng:-70.19},
  {k:'maria-elena',  n:'María Elena',          lat:-22.35, lng:-69.66},
  {k:'quillagua',    n:'Quillagua',            lat:-21.65, lng:-69.54},
  {k:'calama',       n:'Calama',               lat:-22.46, lng:-68.93},
  {k:'sierra-gorda', n:'Sierra Gorda',         lat:-22.89, lng:-69.32},
  {k:'alto-loa',     n:'Alto Loa',             lat:-22.30, lng:-68.40},
  {k:'ollague',      n:'Ollagüe',              lat:-21.22, lng:-68.25},

// Grilla del diorama. El núcleo (lat -22.1..-23.9, lng -71..-68.7) mantiene la escala de la primera versión;
// el norte, el sur y la precordillera se comprimen para que quepan Ollagüe, Taltal y el Salar de Atacama.
const W = 80, ZMIN = -9, ZMAX = 58, D = ZMAX - ZMIN;
const gx = lng => lng <= -68.7 ? (lng+71)*27.826 : 64 + (lng+68.7)*18;
const gz = lat => lat > -22.1 ? -(lat+22.1)*9 : (lat >= -23.9 ? (-22.1-lat)*24.444 : 44 + (-23.9-lat)*8);
const PIT = {x:58.5, z:3.5, r:4};
const SEPARA = PIT.r + 9; // ningún pueblo ni pin a menos de esto del centro del rajo (no mostrar casas junto a una faena)
function geo(lat,lng){
  const p = {x:gx(lng), z:gz(lat)}, dx=p.x-PIT.x, dz=p.z-PIT.z, d=Math.hypot(dx,dz)||1;
  if (d < SEPARA) { p.x = PIT.x+dx/d*SEPARA; p.z = PIT.z+dz/d*SEPARA; }
  return p;
}

function hash(x,z){const h=Math.sin(x*127.1+z*311.7)*43758.5453;return h-Math.floor(h);}
function vn(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,s=t=>t*t*(3-2*t);
  const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1),u=s(xf),v=s(zf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const coastX = z => 15.5 + (vn(3.1,z*0.35)-0.5)*2.4 - 6*Math.exp(-(((z-19.5)/2.6)**2)) + (z<8 ? (8-z)*0.55 : 0);

function distSeg(px,pz,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];
  const t=Math.max(0,Math.min(1,((px-a[0])*dx+(pz-a[1])*dz)/(dx*dx+dz*dz)));
  return Math.hypot(px-a[0]-t*dx,pz-a[1]-t*dz);}
function distPoly(px,pz,P){let m=1e9;for(let i=0;i<P.length-1;i++)m=Math.min(m,distSeg(px,pz,P[i],P[i+1]));return m;}
function mkPath(P){const cum=[0];for(let i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));return{P,cum,L:cum[cum.length-1]};}
function pathAt(pa,s){s=Math.max(0,Math.min(pa.L,s));let i=0;while(i<pa.P.length-2&&pa.cum[i+1]<s)i++;
  const a=pa.P[i],b=pa.P[i+1],l=pa.cum[i+1]-pa.cum[i],t=l?(s-pa.cum[i])/l:0,dx=b[0]-a[0],dz=b[1]-a[1];
  return{x:a[0]+dx*t,z:a[1]+dz*t,yaw:Math.atan2(dx,dz)};}

const RAIL  = [[54,12],[50,13.5],[47,17],[44,20.5],[38,23],[31,26],[24,29.5],[18,31.5]];

/* Vóxeles estáticos: B = escenario, L = luces (ventanas y faroles que se encienden de noche) */
const B = [], L = []; // [cx,cy,cz,w,h,d,yaw,color,pitch]
const box  = (x,y,z,w,h,d,c,yaw=0,pitch=0) => B.push([x+w/2,y+h/2,z+d/2,w,h,d,yaw,c,pitch]);
const boxC = (cx,cy,cz,w,h,d,c,yaw=0,pitch=0) => B.push([cx,cy,cz,w,h,d,yaw,c,pitch]);
const luz  = (x,y,z,w,h,d,c='#5c7a99') => L.push([x+w/2,y+h/2,z+d/2,w,h,d,0,c,0]);
const ocupado = new Set(); const oc = (x,z)=>ocupado.add(Math.floor(x)+','+Math.floor(z)); const esOc=(x,z)=>ocupado.has(Math.floor(x)+','+Math.floor(z));

const DESIERTO = ['#e4b07a','#dba56c','#d29a60','#e9bb88','#dfa978'];
const COSTRA = ['#efe9dc','#e7dfcd','#f4f0e6','#e2d8c3'];
const H = new Float32Array(W*D);
const idx = (x,z) => (Math.max(ZMIN,Math.min(ZMAX-1,Math.floor(z)))-ZMIN)*W + Math.max(0,Math.min(W-1,Math.floor(x)));
const alto = (x,z) => H[idx(x,z)];
const esMar = (x,z) => x < coastX(z);
const RUTAS_PLANAS = [RAIL, GP.cobre, GP.litio, LROAD, PIPE];

for (let z=ZMIN; z<ZMAX; z++) for (let x=0; x<W; x++) {
  const X=x+.5, Z=z+.5, cx=coastX(Z);
  if (X < cx) { // mar
    const bajo = cx - X < 2.2;
    box(x,-3,z,1,2.3,1, hash(x,z)>.5?'#1b6a8f':'#1a6488');
    box(x,-0.7,z,1,1,1, bajo ? (hash(x+3,z)>.5?'#4fd0cf':'#46c7c8') : (hash(x,z+7)>.5?'#25aebb':'#22a6b5'));
    H[idx(x,z)] = 0.3; continue;
  }
  let h = 1, col = DESIERTO[Math.floor(hash(x,z)*DESIERTO.length)];
  const cercaRuta = RUTAS_PLANAS.some(P => distPoly(X,Z,P) < 1.9);
  const dp = Math.hypot(X-PIT.x, Z-PIT.z);
  if (dp < PIT.r) {
    const dep = Math.min(3, Math.ceil((PIT.r-dp)/1.2)); h = 1-dep;
    col = dep>=3 ? '#5f8f88' : (dep%2 ? '#bb9670' : '#8c6c52');
  } else if (enSalar(X,Z)) {
    col = COSTRA[Math.floor(hash(x,z)*COSTRA.length)];
  } else if (!cercaRuta && !enPlano(X,Z)) {
    let e = 0;
    const cresta = Math.max(0, 1-Math.abs(X-(cx+7.5))/3.5); if (Z<28 || Z>45) e += cresta*(1.2+3.2*vn(X*.25,Z*.25));
    const dom = Math.max(0, 1-Math.abs(X-62.5)/3.5); if (Z>17 && Z<47) e += dom*(1.4+3*vn(X*.22,Z*.22)); // Cordillera Domeyko
    if (X>77.2) e += (X-77.2)/2.6*(1.5+2.5*vn(X*.2,Z*.2));                                              // Andes
    if (Z<-2 && X>58) e += 1+2*vn(X*.3,Z*.3);                                                             // altiplano
    for (const [vx,vz,vr,vk] of VOLCANES) { const dv=Math.hypot(X-vx,Z-vz); if (dv<vr) e = Math.max(e,(vr-dv)*vk); }
    if (vn(X*.4+50,Z*.4) > .86) e += 1;

  }
  if (dp >= PIT.r && h===1 && distPoly(X,Z,RAIL)<1.1) col = hash(x,z)>.5?'#c9b196':'#bfa78c';
  H[idx(x,z)] = h;
  if (h-1 > -3) box(x,-3,z,1,h-1+3,1, hash(z,x)>.5?'#8a5a3b':'#82543a');

}

/* Riel */
for (let i=0;i<RAIL.length-1;i++){

  for (let s=0.3; s<Ln; s+=0.8) boxC(a[0]+dx*s/Ln, 1.06, a[1]+dz*s/Ln, 1.3,0.12,0.28,'#5b4030',yaw);
  for (const o of [-0.4,0.4]) boxC((a[0]+b[0])/2+px*o, 1.2, (a[1]+b[1])/2+pz*o, 0.12,0.14,Ln+0.1,'#3d4250',yaw);
}
/* Camino del litio */
for (let i=0;i<LROAD.length-1;i++){
  const a=LROAD[i], b=LROAD[i+1], dx=b[0]-a[0], dz=b[1]-a[1], Ln=Math.hypot(dx,dz), yaw=Math.atan2(dx,dz);
  boxC((a[0]+b[0])/2, 1.03, (a[1]+b[1])/2, 1.2,0.06,Ln+0.6,'#4a4e5a',yaw);
  for (let s=0.6; s<Ln; s+=1.4) boxC(a[0]+dx*s/Ln, 1.07, a[1]+dz*s/Ln, 0.12,0.03,0.6,'#f3efe2',yaw);
}
/* Acueducto: agua de mar desde la desaladora hasta la concentradora */
for (let i=0;i<PIPE.length-1;i++){

  for (let s=0.5; s<Ln; s+=2.2) boxC(a[0]+dx*s/Ln, 1.13, a[1]+dz*s/Ln, .14,.26,.14,'#5c6577',yaw);
}

/* Pueblos */
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
const PASTEL=['#f4efe6','#ead9c4','#f6c89f','#cfe3ea','#f2b8a0','#ffffff','#e7e2f0','#f8dc9b'];
const ADOBE=['#c9a27e','#d4b08a','#bf9470','#e0c39c','#cfa883'];
const libre = (X,Z) => !esOc(X,Z) && !esMar(X-.6,Z) && alto(X,Z)===1 && !enSalar(X,Z) && Math.hypot(X-PIT.x,Z-PIT.z) >= SEPARA-1.5 &&
  distPoly(X,Z,RAIL)>=1.6 && distPoly(X,Z,GP.cobre)>=1.6 && distPoly(X,Z,GP.litio)>=1.6 && distPoly(X,Z,LROAD)>=1.4 && distPoly(X,Z,PIPE)>=1.1;
function arbol(x,z,s=1){ box(x+.4,1,z+.4,.2,1.1*s,.2,'#7a5532'); box(x+.1,1+1*s,z+.1,.8,.7*s,.8,'#3f8f3a'); box(x+.25,1.55+1*s,z+.25,.5,.35,.5,'#55a94a'); }
function pueblo(x0,z0,x1,z1,n,maxH,seed,estilo='costa'){
  const r=rnd(seed);
  for(let i=0;i<n;i++){
    const x=Math.floor(x0+r()*(x1-x0)), z=Math.floor(z0+r()*(z1-z0));
    const w=r()<.35?2:1, d=r()<.35?2:1, hh=1+Math.floor(r()*r()*maxH+r()*1.2);
    let ok=true;

function malla(lista, mat, sombras=true){
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, lista.length);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), p=new THREE.Vector3(), s=new THREE.Vector3(), c=new THREE.Color();
  lista.forEach((b,i)=>{ p.set(b[0],b[1],b[2]); s.set(b[3],b[4],b[5]); e.set(b[8]||0,b[6],0,'YXZ'); q.setFromEuler(e); m.compose(p,q,s);
    im.setMatrixAt(i,m); im.setColorAt(i,c.set(b[7])); });
  im.castShadow = im.receiveShadow = sombras; scene.add(im); return im;
}

/* Gorito camina hasta un pin: línea recta por tierra (rodea el mar y el rajo), subiendo y bajando el relieve */
function trazar(a, b){
  const pts = [[a.x,a.z]]; let x = a.x, z = a.z;
  if (esMar(x,z)) { x = coastX(z)+1.2; pts.push([x,z]); }            // sale del muelle hacia tierra
  const destinoMar = esMar(b.x,b.z), bx = destinoMar ? coastX(b.z)+1.2 : b.x;
  const n = Math.max(2, Math.ceil(Math.hypot(bx-x, b.z-z)));
  for (let i=1;i<=n;i++){ let px = x+(bx-x)*i/n, pz = z+(b.z-z)*i/n;
    const c = coastX(pz)+1.2; if (px < c) px = c;
    const dp = Math.hypot(px-PIT.x, pz-PIT.z); if (dp < PIT.r+1.5) { px = PIT.x+(px-PIT.x)/dp*(PIT.r+1.5); pz = PIT.z+(pz-PIT.z)/dp*(PIT.r+1.5); }
    pts.push([px,pz]); }
  if (destinoMar) pts.push([b.x,b.z]);                                 // entra al muelle
  return pts;
}
function irAPin(k){
  const pin = pines.find(p=>p.k===k); if (!pin) return;
  const cur = {x:gorito.position.x, z:gorito.position.z}, dx = pin.pos.x-cur.x, dz = pin.pos.z-cur.z, d = Math.hypot(dx,dz);
  if (d < 3) { abrirLista(k); return; }
  if (!excursion && !fuera) gObj = gS;                                 // la ruta queda en pausa donde iba
  const meta = {x: pin.pos.x - dx/d*1.6, z: pin.pos.z - dz/d*1.6};
  fuera = null; auto = true; callar(); clearInterval(escribiendo); escribiendo = null;
  excursion = {path: mkPath(trazar(cur, meta)), s:0, fin:()=>{ fuera = meta; abrirLista(k); $('dTexto').textContent = $('lGor').textContent; }};
  $('dTexto').textContent = `¡Vamos a ${TN[k].n}! 🏃`; $('dFuente').textContent = ''; $('dPin').hidden = true;
}

/* Tres maneras de decir «aquí hay iniciativas»: se turnan sin repetir la anterior.
   El audio es genérico; el texto en pantalla nombra el lugar y la cantidad. Una frase entra a la rotación solo si su audio existe. */
const FRASES_PIN = [
  {a:'g-pin',   txt:(t,n,oe)=>`¡Mira! ${t.k==='regional'?'Para toda la región':'En '+t.n} hay ${n} iniciativas de la EMRA${oe}. Toca una para ver cómo avanza.`},
  {a:'g-pin-2', txt:(t,n,oe)=>`¡Llegamos${t.k==='regional'?'':' a '+t.n}! Aquí la EMRA tiene ${n} ${n===1?'iniciativa':'iniciativas'}${oe}. ${n===1?'Tócala':'Elige una'} para conocerla.`},
  {a:'g-pin-3', txt:(t,n,oe)=>`¡Qué bueno! ${t.k==='regional'?'Para toda la región':'En '+t.n} también hay ${n} iniciativas de la EMRA${oe}. Toca una para ver en qué va.`},
];

let turnoPin = Math.floor(Math.random()*FRASES_PIN.length);
function elegirFrase(n){
  if (n === 1) return FRASES_PIN[1];                       // la única que no habla de «iniciativas» en plural
  for (let i=0;i<FRASES_PIN.length;i++) { turnoPin = (turnoPin+1) % FRASES_PIN.length; if (FRASES_PIN[turnoPin].ok) return FRASES_PIN[turnoPin]; }
  return FRASES_PIN[0];
}

  const SB='https://tjoveoqolrfxntvvdjwh.supabase.co/rest/v1/iniciativas?order=id&select=id,nombre,oe,ciudad,lat,lng,tipo,responsable,descripcion,image_url';
  fetch(SB,{headers:{apikey:'sb_publishable_CC2mhTuNvau_uoo9myThCw_7milAiHE'}}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(rows=>{
    if (!Array.isArray(rows) || rows.length<10) return; // ante algo raro, se queda con la copia de respaldo
    const terr = c => /Calama/.test(c)?'calama':/Tocopilla/.test(c)?'tocopilla':/Antofagasta/.test(c)?'antofagasta':'regional';
    const vivos = rows.filter(r=>r.nombre).map(r=>({id:r.id,n:r.nombre,oe:[+String(r.oe).replace(/\D/g,'')||1],t:terr(r.ciudad||''),loc:r.ciudad||'',
      tipo:r.tipo||'',inst:r.responsable||'',d:r.descripcion||'',img:r.image_url||''}));
    const ids = new Set(vivos.map(x=>x.id));
    DATOS.mediano = [...vivos, ...DATOS.mediano.filter(x=>!ids.has(x.id))]; // conserva las locales que aún no están en Supabase
    INI = todas(); pintarPines(); if (!caminando) mostrarDialogo();
  }).catch(()=>{});
})();

/* ═════════ Tamaño ═════════ */
const FH = 60;
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w,h,false);
  camera.left = -FH*a/2; camera.right = FH*a/2; camera.top = FH/2; camera.bottom = -FH/2;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const zoomPara = (w,h) => Math.min((FH*innerWidth/innerHeight)/w, FH/h) * 0.92;

/* ═════════ Bucle ═════════ */
const reloj = new THREE.Clock(), tmp = new THREE.Vector3();
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(){
  const dt = Math.min(.1, reloj.getDelta()), t = reloj.elapsedTime;
  const k = reducido ? 1 : 1-Math.exp(-dt*2.4);

  // Gorito camina por la ruta
  let gp, yawMov = null, anda = false;
  if (excursion) {                                   // caminata hasta un pin (o de vuelta a la ruta)
    excursion.s = Math.min(excursion.path.L, excursion.s + (reducido?60:16)*dt);
    gp = pathAt(excursion.path, excursion.s); yawMov = gp.yaw; anda = true; caminando = false;
    if (excursion.s >= excursion.path.L) { const ex = excursion; excursion = null; ex.fin(); }
  } else if (fuera) { gp = {x:fuera.x, z:fuera.z}; caminando = false; }
  else {
    const dif = gObj - gS, eraCaminando = caminando;
    caminando = Math.abs(dif) > .01;
    if (caminando) gS += Math.sign(dif) * Math.min(Math.abs(dif), (reducido?60:10)*dt);
    gp = pathAt(gpath(), gS);
    if (caminando) { yawMov = dif>0 ? gp.yaw : gp.yaw+Math.PI; anda = true; }
    if (eraCaminando && !caminando) mostrarDialogo();
  }
  const suelo = esMar(gp.x,gp.z) ? 1 : Math.max(1, alto(gp.x,gp.z));
  gy += (suelo-gy)*Math.min(1, dt*12);
  salto = Math.max(0, salto - dt*1.6);
  gorito.position.set(gp.x, gy + Math.sin(salto*Math.PI)*1.2*(salto>0), gp.z);
  let yawObj;
  if (yawMov !== null) yawObj = yawMov;
  else { tmp.copy(camera.position).sub(controls.target); yawObj = Math.atan2(tmp.x,tmp.z); }
  const dy = ((yawObj-yawG+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; yawG += dy*Math.min(1,dt*10); gorito.rotation.y = yawG;
  const ph = t*(excursion?15:11);
  piernas[0].rotation.x = anda ? Math.sin(ph)*.6 : 0; piernas[1].rotation.x = anda ? -Math.sin(ph)*.6 : 0;
  cuerpo.position.y = anda ? Math.abs(Math.sin(ph))*.12 : Math.sin(t*2.2)*.03;
  const hablando = !!escribiendo || hablaVoz();
  brazos[0].rotation.x = anda ? -Math.sin(ph)*.5 : 0;
  brazos[1].rotation.x = anda ? Math.sin(ph)*.5 : 0;
  brazos[1].rotation.z = (!anda && hablando) || salto>0 ? 2.3 + Math.sin(t*8)*.25 : brazos[1].rotation.z*.85;
  brazos[0].rotation.z = salto>0 ? -2.3 : brazos[0].rotation.z*.85;
  boca.scale.y = hablando ? 1 + Math.abs(Math.sin(t*18))*1.6 : 1;

  // Cámara: sigue a Gorito al caminar y encuadra la parada al llegar
  if (auto) {
    const p = P(); let tx,ty,tz,w,h;
    if (excursion) { tx=gp.x; ty=gy; tz=gp.z; w=40; h=28; }
    else if (fuera) { tx=fuera.x; ty=gy; tz=fuera.z; w=24; h=17; }
    else if (caminando) { tx=gp.x; ty=1; tz=gp.z; w=34; h=24; } else { [tx,ty,tz]=p.cam; w=p.w; h=p.h; }
    tmp.copy(camera.position).sub(controls.target);
    controls.target.lerp(camT.set(tx,ty,tz), k);
    camera.position.copy(controls.target).add(tmp);
    camera.zoom += (zoomPara(w,h)-camera.zoom)*k; camera.updateProjectionMatrix();
  }
  controls.update();

  // Día y noche
  noche += (nocheObj-noche)*Math.min(1,dt*1.5);
  hemi.intensity = 1.5 - 1.1*noche; sun.intensity = 2.4 - 2.05*noche; sun.color.copy(SOL_DIA).lerp(SOL_NOCHE, noche);
  matLuces.emissiveIntensity = noche*1.6;
  document.body.style.setProperty('--noche', noche.toFixed(3)); document.body.classList.toggle('noche', noche>.5);

  // Tren
  tren_s += tren_dir*3.2*dt;
  if (tren_s > rail.L) { tren_s = rail.L; tren_dir = -1; } if (tren_s < 7.5) { tren_s = 7.5; tren_dir = 1; }
  tren.forEach((car,i)=>{ const q = pathAt(rail, tren_s - tren_dir*i*1.75); car.position.set(q.x,1.28,q.z); car.rotation.y = q.yaw; });
  // Camiones del litio
  for (const c of camionesLitio) { c.s += c.dir*3*dt; if (c.s>lroad.L){c.s=lroad.L;c.dir=-1;} if (c.s<0){c.s=0;c.dir=1;}
    const q = pathAt(lroad, c.s); c.c.position.set(q.x,1.06,q.z); c.c.rotation.y = q.yaw + (c.dir<0?Math.PI:0); }
  // Camión en el rajo
  const ang = t*.35; camion.position.set(PIT.x+Math.cos(ang)*2.4, -1, PIT.z+Math.sin(ang)*2.4); camion.rotation.y = -ang;
  // Personas de la faena
  personas.forEach(({p,br,i})=>{ p.position.y = 1 + Math.abs(Math.sin(t*2+i))*.03; br.rotation.z = i===1 ? 2.4+Math.sin(t*6)*.4 : Math.sin(t*1.5+i)*.15; });

  // Mar: barco (zarpa en el muelle), botes y gaviotas
  const zarpa = ruta==='cobre' && P().a==='c-muelle', bo = zarpa ? BARCO_B : BARCO_A, kb = Math.min(1, dt*.35);
  barco.position.x += (bo.x-barco.position.x)*kb; barco.position.z += (bo.z-barco.position.z)*kb; barco.rotation.y += (bo.yaw-barco.rotation.y)*kb;
  barco.position.y = Math.sin(t*1.1)*.08;
  botes.forEach((b,i)=>{ b.position.y = .3+Math.sin(t*1.6+i)*.08; b.rotation.z = Math.sin(t*1.3+i)*.05; });
  for (const s of gaviotas) { const a = t*s.sp + s.ph;
    s.g.position.set(s.cx+Math.cos(a)*s.r, s.h+Math.sin(t*.8+s.ph)*.4, s.cz+Math.sin(a)*s.r); s.g.rotation.y = -a;
    const f = Math.sin(t*9+s.ph)*.6; s.a1.rotation.z = f; s.a2.rotation.z = -f; }
  // Pines
  pines.forEach((p,i)=>{ for (const n of [1,2,3,4,5]) { const c=p.cubos[n]; if(!c.visible) continue; c.rotation.y = t*1.2+i; c.position.y = c.userData.y + Math.sin(t*2+i)*.12; } });

  renderer.render(scene, camera);

  // Etiquetas HTML de los pines (sin encimarse)
  const chico = (camera.right-camera.left)/camera.zoom > 48;
  const puestos = [];
  for (const p of pines) { if (p.el.hidden) continue;
    tmp.set(p.pos.x, p.g.position.y + (p.alto||4.4) + 1, p.pos.z).project(camera);
    p.el.classList.toggle('chico', chico && !p.el.classList.contains('activo'));
    puestos.push({p, x:(tmp.x+1)/2*innerWidth, y:(1-tmp.y)/2*innerHeight, w:p.el.offsetWidth, h:p.el.offsetHeight});
  }
  puestos.sort((a,b)=>a.y-b.y);
  for (let i=0;i<puestos.length;i++) for (let j=0;j<i;j++) { const a=puestos[j], b=puestos[i];
    if (Math.abs(a.x-b.x) < (a.w+b.w)/2+4 && b.y-a.y < b.h+4) b.y = a.y + b.h + 4; }
  for (const q of puestos) { q.p.el.style.left = q.x+'px'; q.p.el.style.top = q.y+'px'; }
  requestAnimationFrame(frame);
}

/* ═════════ Inicio ═════════ */
$('cargando').remove();
pintarPines();
{ // ?ruta=litio&p=N abre directo en una parada (para enlazar o grabar reels); ?noche=1 parte de noche
  const q = new URLSearchParams(location.search), r = q.get('ruta')==='litio' ? 'litio' : 'cobre';
  const p0 = Math.max(0, Math.min(RUTAS[r].paradas.length-1, parseInt(q.get('p')) || 0));
  if (q.get('noche')==='1') { nocheObj = noche = 1; $('bNoche').textContent='☀️'; }
  ruta = r; const pp = RUTAS[r].paradas[p0];
  controls.target.set(...pp.cam); camera.position.copy(controls.target).add(OFFSET);
  camera.zoom = zoomPara(pp.w, pp.h); camera.updateProjectionMatrix();
  cambiarRuta(r, p0);
}
frame();
</script>
