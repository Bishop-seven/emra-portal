<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Demo hero emra.cl</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#383838;background:#fff}
.top{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:14px 32px}

nav{background:#383838}nav div{max-width:1180px;margin:0 auto;padding:12px 32px;display:flex;gap:22px;color:#fff;font-size:15px;text-transform:uppercase}

.siguiente{max-width:1100px;margin:0 auto;padding:60px 32px}

<nav><div><span>Inicio</span><span>EMRA 2023-2050</span><span>Gobernanza</span><span>Objetivos</span><span>Acuerdos</span><span>Actualidad</span><span>Documentos</span></div></nav>

<div class="siguiente"><h2>EMRA en videos</h2><p>(El resto del home sigue igual que hoy.)</p><div style="height:900px"></div></div>
