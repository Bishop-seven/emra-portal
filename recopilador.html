<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Recopilador EMRA</title>
<style>
:root{
  --bg:#081220;--panel:#0d1b2e;--panel2:#112236;--line:#1e3350;--txt:#e6eef7;--mut:#8aa0b8;
  --brand:#038fcf;--ok:#10b981;--warn:#EFAD1B;--bad:#ef4444;
  --oe1:#EFAD1B;--oe2:#287566;--oe3:#FF6633;--oe4:#038FCF;--oe5:#19BAB6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--panel2);color:var(--txt)}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--brand);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.bad{background:transparent;color:var(--bad);border:1px solid #ef444466}
button.sm{padding:4px 10px;font-size:12px}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.hide{display:none!important}

/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
#login form{width:100%;max-width:360px;background:var(--panel);padding:28px;border-radius:16px;border:1px solid var(--line)}
#login h1{margin:0 0 4px;font-size:20px}
#login p{margin:0 0 12px;color:var(--mut)}
#login .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}

/* App */
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .logo{font-weight:700;letter-spacing:.3px}
header .logo b{color:var(--brand)}
header nav{display:flex;gap:6px;margin-left:12px}
header nav button{background:transparent;color:var(--mut)}
header nav button.on{background:var(--panel2);color:var(--txt)}
header .chip{margin-left:auto;color:var(--mut);font-size:12px}
main{flex:1;min-height:0;display:flex}

/* Recopilar */
#v-rec{flex:1;display:grid;grid-template-columns:230px 1fr 400px;min-height:0}
#sesiones{border-right:1px solid var(--line);overflow:auto;padding:12px}
#sesiones button.nueva{width:100%;margin-bottom:10px}
.ses{padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13px;margin-bottom:2px}
.ses:hover{background:var(--panel)}
.ses.on{background:var(--panel2);color:var(--txt)}
.ses small{display:block;font-size:11px;opacity:.7}

#chat{display:flex;flex-direction:column;min-height:0;min-width:0}
#msgs{flex:1;overflow:auto;padding:20px}
.msg{max-width:760px;margin:0 auto 14px}
.msg.u .bub{background:var(--panel2);margin-left:auto;max-width:85%}
.msg .bub{padding:10px 14px;border-radius:12px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.msg.a .bub{background:transparent;padding-left:0}
.msg .bub p{margin:0 0 8px}.msg .bub p:last-child{margin:0}
.msg .bub ul,.msg .bub ol{margin:4px 0 8px;padding-left:20px}
.att{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;margin:0 6px 6px 0}
.tool{font-size:12px;color:var(--mut);margin:2px 0}
.tool b{color:var(--txt);font-weight:500}
.vacio{max-width:560px;margin:40px auto;color:var(--mut);text-align:center}
.vacio h2{color:var(--txt);font-size:18px}
.pensando{color:var(--mut);font-style:italic}

#composer{border-top:1px solid var(--line);padding:12px 16px}
#adjuntos{display:flex;flex-wrap:wrap}
#adjuntos .att button{background:none;padding:0 2px;color:var(--mut)}
.fila{display:flex;gap:8px;align-items:flex-end;max-width:760px;margin:0 auto}
#inp{min-height:44px;max-height:200px}
#drop{position:fixed;inset:0;background:#038fcf22;border:3px dashed var(--brand);display:grid;place-items:center;font-size:20px;z-index:50;pointer-events:none}

#borradores{border-left:1px solid var(--line);overflow:auto;padding:12px;background:var(--panel)}
#borradores h3{margin:4px 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
#borradores h3 span{color:var(--mut);font-weight:400}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h4{margin:0 0 6px;font-size:14px}
.card .desc{color:var(--mut);font-size:13px;margin:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--txt)}
.tag.oe{color:#081220;font-weight:600}
.falta{font-size:12px;color:var(--warn);margin-top:6px}
.est{font-size:11px;padding:2px 8px;border-radius:999px;margin-left:auto}
.est.borrador{background:#8aa0b833}.est.lista{background:#038fcf33;color:#7cc8ef}
.est.aprobada{background:#10b98133;color:#6ee7b7}.est.rechazada{background:#ef444433;color:#fca5a5}
.card .acc{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .meta{font-size:11px;color:var(--mut);margin-top:6px}

/* Revisión */
#v-rev{flex:1;overflow:auto;padding:20px}
#v-rev .wrap{max-width:900px;margin:0 auto}
#v-rev .filtros{display:flex;gap:6px;margin:0 0 16px}
#v-rev .filtros button.on{background:var(--brand);color:#fff}
.diff{font-size:12px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.diff div{margin:2px 0}.diff del{color:#fca5a5}.diff ins{color:#6ee7b7;text-decoration:none}

/* Modal */
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:60}
#modal form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
#modal .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 16px;border-radius:8px;z-index:70}

@media (max-width:1100px){#v-rec{grid-template-columns:1fr 360px}#sesiones{display:none}}
@media (max-width:760px){
  #v-rec{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #borradores{border-left:0;border-top:1px solid var(--line);max-height:40vh}
  header nav{margin-left:0}header .chip{display:none}
  #modal .g2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login">
  <form onsubmit="login(event)">
    <h1>Recopilador <span style="color:var(--brand)">EMRA</span></h1>
    <p>Ingresa con tu cuenta del administrador del portal.</p>
    <label>Correo</label><input id="l-email" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="l-pwd" type="password" autocomplete="current-password" required>
    <div class="err" id="l-err"></div>
    <button class="pri" id="l-btn" style="width:100%;margin-top:8px">Ingresar</button>
  </form>
</section>

<section id="app" class="hide">
  <header>
    <div class="logo"><b>EMRA</b> · Recopilador</div>
    <nav>
      <button id="t-rec" class="on" onclick="vista('rec')">Recopilar</button>
      <button id="t-rev" class="hide" onclick="vista('rev')">Revisión</button>
    </nav>
    <div class="chip" id="chip"></div>
    <button class="sm" onclick="logout()">Salir</button>
  </header>
  <main>
    <div id="v-rec">
      <aside id="sesiones"></aside>
      <section id="chat">
        <div id="msgs"></div>
        <div id="composer">
          <div class="fila" style="flex-direction:column;align-items:stretch">
            <div id="adjuntos"></div>
            <div class="fila" style="width:100%;margin:0">
              <button title="Adjuntar archivo" onclick="document.getElementById('file').click()">📎</button>
              <input type="file" id="file" multiple class="hide"
                accept=".xlsx,.xls,.csv,.pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp,.gif" onchange="adjuntar(this.files);this.value=''">
              <textarea id="inp" rows="1" placeholder="Escribe o pega información, o adjunta un Excel, PDF, Word o imagen…"></textarea>
              <button class="pri" id="send" onclick="enviar()">Enviar</button>
            </div>
          </div>
        </div>
      </section>
      <aside id="borradores"></aside>
    </div>
    <div id="v-rev" class="hide"><div class="wrap" id="rev"></div></div>
  </main>
</section>

<div id="modal" class="hide"></div>
<div id="drop" class="hide">Suelta los archivos aquí</div>
<div id="toast" class="hide"></div>

<script>
// ── CONFIG ── (mismo Supabase y proxy de Claude que el portal)
const SB_URL = 'https://tjoveoqolrfxntvvdjwh.supabase.co';
const SB_KEY = 'sb_publishable_CC2mhTuNvau_uoo9myThCw_7milAiHE';
const _prod = location.protocol.startsWith('http') && !['localhost','127.0.0.1'].includes(location.hostname);
const CLAUDE_URL = (_prod ? location.origin + '/api/w' : 'https://emra-ai-proxy.emraportal.workers.dev') + '/v1/messages';
const MODEL = 'claude-sonnet-4-6';
const MAX_BINARIO = 4 * 1024 * 1024;   // el rewrite de Vercel no acepta cuerpos mucho mayores

const OE = {
  'OE 1':{label:'Calidad de vida',color:'var(--oe1)'},
  'OE 2':{label:'Minería sustentable',color:'var(--oe2)'},
  'OE 3':{label:'Empresas regionales',color:'var(--oe3)'},
  'OE 4':{label:'Gobernanza',color:'var(--oe4)'},
  'OE 5':{label:'Conocimiento e innovación',color:'var(--oe5)'},
};
const CIUDADES = {Antofagasta:{p:'a',lat:-23.65,lng:-70.40}, Calama:{p:'c',lat:-22.46,lng:-68.93},
                  Tocopilla:{p:'t',lat:-22.09,lng:-70.20}, Regional:{p:'r',lat:-23.10,lng:-69.60}};
const PLAZOS = ['Corto plazo 2023-2026','Mediano plazo 2026-2030','Largo plazo 2030-2050'];
const FASES = ['Iniciativa','Prefactibilidad','Diseño','Piloto','En ejecución'];
const CAMPOS = ['nombre','oe','ciudad','tipo','plazo','fase','responsable','descripcion','lat','lng'];

// ── ESTADO ──
let SESSION = null, SESION = null, MSGS = [], BORR = [], ADJ = [], OCUPADO = false, REV_FILTRO = 'lista';

// ── UTIL ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.remove('hide'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.add('hide'),2800); }
function md(t){
  // Markdown mínimo: párrafos, listas, **negrita**, `código`
  const lines = esc(t).split('\n'); let out='', lista=null;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const l of lines){
    const ul=l.match(/^\s*[-•*]\s+(.*)/), ol=l.match(/^\s*\d+[.)]\s+(.*)/);
    const tipo = ul?'ul':ol?'ol':null;
    if(lista && tipo!==lista){ out+=`</${lista}>`; lista=null; }
    if(tipo){ if(!lista){ out+=`<${tipo}>`; lista=tipo; } out+=`<li>${inl((ul||ol)[1])}</li>`; }
    else if(l.trim()) out+=`<p>${inl(l.replace(/^#+\s*/,''))}</p>`;
  }
  if(lista) out+=`</${lista}>`;
  return out;
}
function cargarScript(src){
  return new Promise((ok,err)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error('No se pudo cargar '+src)); document.head.appendChild(s); });
}

// ── SUPABASE ──
async function authReq(path, body){
  const r = await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json(); if(!r.ok) throw new Error(d.error_description||d.msg||d.error||'Error de autenticación'); return d;
}
function guardarSesion(d){
  SESSION = d ? {access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at: d.expires_at ? d.expires_at*1000 : Date.now()+(d.expires_in||3600)*1000,
    email:d.user?.email ?? SESSION?.email, nombre:d.user?.user_metadata?.nombre || d.user?.email || SESSION?.nombre,
    rol:d.user?.app_metadata?.rol || SESSION?.rol || 'editor'} : null;
  try{ SESSION ? localStorage.setItem('emra_recop', JSON.stringify(SESSION)) : localStorage.removeItem('emra_recop'); }catch(e){}
}
async function token(){
  if(!SESSION) return SB_KEY;
  if(SESSION.expires_at - 60000 > Date.now()) return SESSION.access_token;
  try{ guardarSesion(await authReq('token?grant_type=refresh_token',{refresh_token:SESSION.refresh_token})); return SESSION.access_token; }
  catch(e){ guardarSesion(null); location.reload(); }
}
async function sb(path, opt={}){
  const r = await fetch(SB_URL+'/rest/v1/'+path,{...opt, headers:{apikey:SB_KEY, Authorization:'Bearer '+await token(),
    'Content-Type':'application/json', Prefer:'return=representation', ...(opt.headers||{})}});
  if(!r.ok) throw new Error('Supabase: '+await r.text());
  const t = r.status===204 ? '' : await r.text(); return t ? JSON.parse(t) : null;
}

// ── LOGIN ──
async function login(e){
  e.preventDefault(); $('l-btn').disabled=true; $('l-err').textContent='';
  try{ guardarSesion(await authReq('token?grant_type=password',{email:$('l-email').value.trim(),password:$('l-pwd').value})); entrar(); }
  catch(err){ $('l-err').textContent = /invalid/i.test(err.message)?'Credenciales incorrectas':err.message; }
  $('l-pwd').value=''; $('l-btn').disabled=false;
}
function logout(){ guardarSesion(null); location.reload(); }
async function entrar(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('chip').textContent = `${SESSION.nombre} · ${SESSION.rol==='admin'?'Administrador':'Editor'}`;
  $('t-rev').classList.toggle('hide', SESSION.rol!=='admin');
  await listarSesiones(); nuevaSesion();
}

function vista(v){
  $('v-rec').classList.toggle('hide', v!=='rec'); $('v-rev').classList.toggle('hide', v!=='rev');
  $('t-rec').classList.toggle('on', v==='rec'); $('t-rev').classList.toggle('on', v==='rev');
  if(v==='rev') renderRevision();
}

// ── SESIONES ──
let SESIONES = [];
async function listarSesiones(){
  SESIONES = await sb('recopilador_sesiones?select=id,titulo,creado_por,updated_at&order=updated_at.desc&limit=50');
  renderSesiones();
}
function renderSesiones(){
  $('sesiones').innerHTML = `<button class="pri nueva" onclick="nuevaSesion()">+ Nueva conversación</button>` +
    SESIONES.map(s=>`<div class="ses ${SESION?.id===s.id?'on':''}" onclick="abrirSesion('${s.id}')">${esc(s.titulo)}
      <small>${new Date(s.updated_at).toLocaleDateString('es-CL',{day:'numeric',month:'short'})} · ${esc((s.creado_por||'').split('@')[0])}</small></div>`).join('');
}
function nuevaSesion(){ SESION=null; MSGS=[]; BORR=[]; ADJ=[]; renderSesiones(); renderMsgs(); renderBorradores(); renderAdjuntos(); }
async function abrirSesion(id){
  if(OCUPADO) return;
  const [s] = await sb('recopilador_sesiones?id=eq.'+id);
  SESION = s; MSGS = s.mensajes || []; ADJ=[];
  renderSesiones(); renderMsgs(); renderAdjuntos(); await cargarBorradores();
}
// Los PDF e imágenes no se guardan en la base (pesan mucho): quedan como una nota.
function paraGuardar(msgs){
  return msgs.map(m => !Array.isArray(m.content) ? m : {...m, content: m.content.map(b =>
    b.type==='document' || b.type==='image' ? {type:'text', text:'[Archivo binario ya leído en una sesión anterior; usa los borradores como referencia]'} : b)});
}
async function guardarConversacion(){
  if(!SESION) return;
  await sb('recopilador_sesiones?id=eq.'+SESION.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({mensajes:paraGuardar(MSGS)})});
}

// ── ADJUNTOS ──
async function adjuntar(files){
  for(const f of files){
    try{ ADJ.push(await leerArchivo(f)); }
    catch(e){ toast(`${f.name}: ${e.message}`); }
  }
  renderAdjuntos();
}
function leerB64(f){ return new Promise((ok,err)=>{ const r=new FileReader(); r.onload=()=>ok(r.result.split(',')[1]); r.onerror=err; r.readAsDataURL(f); }); }
async function leerArchivo(f){
  const ext = f.name.split('.').pop().toLowerCase();
  const base = {nombre:f.name};
  if(['xlsx','xls','csv'].includes(ext)){
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    let txt = wb.SheetNames.map(n => `### Hoja "${n}"\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], {blankrows:false})).join('\n\n');
    if(txt.length > 150000) txt = txt.slice(0,150000) + '\n[… archivo truncado por tamaño]';
    return {...base, tipo:'planilla', bloques:[{type:'text', text:`[[ADJUNTO:${f.name}]]\n${txt}`}]};
  }
  if(ext==='docx'){
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    const r = await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()});
    return {...base, tipo:'word', bloques:[{type:'text', text:`[[ADJUNTO:${f.name}]]\n${r.value.slice(0,150000)}`}]};
  }
  if(['txt','md'].includes(ext)){
    return {...base, tipo:'texto', bloques:[{type:'text', text:`[[ADJUNTO:${f.name}]]\n${(await f.text()).slice(0,150000)}`}]};
  }
  if(f.size > MAX_BINARIO) throw new Error('supera 4 MB; comprímelo o divídelo');
  if(ext==='pdf'){
    return {...base, tipo:'pdf', bloques:[{type:'text', text:`[[ADJUNTO:${f.name}]]`},
      {type:'document', source:{type:'base64', media_type:'application/pdf', data:await leerB64(f)}, title:f.name}]};
  }
  if(['png','jpg','jpeg','webp','gif'].includes(ext)){
    const mt = ext==='jpg'?'image/jpeg':'image/'+ext;
    return {...base, tipo:'imagen', bloques:[{type:'text', text:`[[ADJUNTO:${f.name}]]`},
      {type:'image', source:{type:'base64', media_type:mt, data:await leerB64(f)}}]};
  }
  throw new Error('formato no soportado');
}
function renderAdjuntos(){
  $('adjuntos').innerHTML = ADJ.map((a,i)=>`<span class="att">📄 ${esc(a.nombre)} <button onclick="ADJ.splice(${i},1);renderAdjuntos()">✕</button></span>`).join('');
}
// arrastrar y soltar
let _dc=0;
addEventListener('dragenter',e=>{ if(!SESSION) return; _dc++; $('drop').classList.remove('hide'); });
addEventListener('dragleave',()=>{ if(--_dc<=0){ _dc=0; $('drop').classList.add('hide'); } });
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{ e.preventDefault(); _dc=0; $('drop').classList.add('hide'); if(SESSION && e.dataTransfer.files.length) adjuntar(e.dataTransfer.files); });

// ── AGENTE ──
function systemPrompt(){
  return `Eres el asistente recopilador de EMRA (Estrategia Minera Regional de Antofagasta, Chile). Ayudas a la persona encargada de reunir información a ORDENAR iniciativas para luego publicarlas en el portal EMRA. Hablas siempre en español de Chile, con un tono cordial y breve.

Tu trabajo:
1. Leer todo lo que te compartan (planillas Excel/CSV, PDF, Word, imágenes, texto pegado) e identificar cada iniciativa.
2. Antes de crear borradores, llama a listar_iniciativas para revisar las que ya están publicadas. Si una iniciativa ya existe, crea el borrador con "actualiza_id" = id existente en vez de duplicarla; conserva el nombre y la descripción publicados salvo que la información nueva los corrija de verdad.
3. Crear un borrador por iniciativa con crear_borrador. Usa listar_borradores para no repetir los de esta conversación.
4. Normalizar los datos a los valores válidos del portal (abajo). Si un dato no viene en la información, NO lo inventes: déjalo vacío y agrégalo en "faltantes". Puedes inferir OE, tipo o plazo cuando sea razonable, pero dilo en "notas".
5. Al terminar, resume en pocas líneas qué creaste y haz preguntas concretas sobre lo que falta o es ambiguo (máximo 3–5 preguntas a la vez). Cuando la persona responda, actualiza los borradores con actualizar_borrador, quitando de "faltantes" y de "notas" lo que ya quedó resuelto.
6. Solo marca un borrador como "listo para revisión" (marcar_listos) cuando la persona lo confirme. La publicación final la hace un administrador; tú nunca publicas.

Valores válidos:
- oe: ${Object.entries(OE).map(([k,v])=>`"${k}" (${v.label})`).join(', ')}
- ciudad: ${Object.keys(CIUDADES).map(c=>`"${c}"`).join(', ')} ("Regional" si abarca varias comunas o toda la región)
- plazo: ${PLAZOS.map(p=>`"${p}"`).join(', ')}
- fase: ${FASES.map(p=>`"${p}"`).join(', ')}
- tipo: categoría breve, p. ej. "Espacio público", "Infraestructura hídrica", "Programa educacional", "Vialidad regional", "Recuperación urbana".
- descripcion: 1 a 2 frases claras para el público general (máx. ~300 caracteres), sin jerga interna.
- responsable: instituciones separadas por " · " (ej. "MOP · DGAC").
- lat/lng: solo si vienen en la información o la ubicación es inequívoca.

Formato de tus respuestas: texto corto, listas simples, sin tablas (la persona ve los borradores en un panel al lado). Cuando hables de un borrador, nómbralo por su nombre, no por su id.`;
}
const TOOLS = [
  {name:'listar_iniciativas', description:'Lista las iniciativas YA PUBLICADAS en el portal, para detectar duplicados o actualizaciones. Filtra opcionalmente por texto (nombre/descripcion/tipo) y ciudad.',
   input_schema:{type:'object', properties:{texto:{type:'string'}, ciudad:{type:'string'}}}},
  {name:'listar_borradores', description:'Lista los borradores de esta conversación con su id, estado y faltantes.',
   input_schema:{type:'object', properties:{}}},
  {name:'crear_borrador', description:'Crea un borrador de iniciativa (no se publica). Deja vacío lo que no se sepa y anótalo en faltantes.',
   input_schema:{type:'object', required:['nombre'], properties:{
     nombre:{type:'string'}, oe:{type:'string', enum:Object.keys(OE)}, ciudad:{type:'string', enum:Object.keys(CIUDADES)},
     tipo:{type:'string'}, plazo:{type:'string', enum:PLAZOS}, fase:{type:'string', enum:FASES},
     responsable:{type:'string'}, descripcion:{type:'string'}, lat:{type:'number'}, lng:{type:'number'},
     fuente:{type:'string', description:'Archivo, hoja o mensaje de donde salió la información'},
     faltantes:{type:'array', items:{type:'string'}, description:'Campos o datos que faltan confirmar'},
     notas:{type:'string', description:'Supuestos, inferencias o dudas para quien revise'},
     actualiza_id:{type:'string', description:'id de la iniciativa publicada si este borrador la actualiza'}}}},
  {name:'actualizar_borrador', description:'Modifica campos de un borrador existente (solo los que se envíen). Para vaciar faltantes envía [].',
   input_schema:{type:'object', required:['id'], properties:{
     id:{type:'string'}, nombre:{type:'string'}, oe:{type:'string', enum:Object.keys(OE)}, ciudad:{type:'string', enum:Object.keys(CIUDADES)},
     tipo:{type:'string'}, plazo:{type:'string', enum:PLAZOS}, fase:{type:'string', enum:FASES},
     responsable:{type:'string'}, descripcion:{type:'string'}, lat:{type:'number'}, lng:{type:'number'},
     fuente:{type:'string'}, faltantes:{type:'array', items:{type:'string'}}, notas:{type:'string'}, actualiza_id:{type:'string'}}}},
  {name:'eliminar_borrador', description:'Elimina un borrador de esta conversación (por ejemplo, si estaba duplicado).',
   input_schema:{type:'object', required:['id'], properties:{id:{type:'string'}}}},
  {name:'marcar_listos', description:'Marca borradores como listos para revisión del administrador. Úsalo solo cuando la persona lo confirme.',
   input_schema:{type:'object', required:['ids'], properties:{ids:{type:'array', items:{type:'string'}}}}},
];
const EDITABLES = [...CAMPOS,'fuente','faltantes','notas','actualiza_id'];
function limpiar(o){ const r={}; for(const k of EDITABLES) if(o[k]!==undefined) r[k]=o[k]; return r; }

async function ejecutarTool(nombre, input){
  switch(nombre){
    case 'listar_iniciativas': {
      let d = await sb('iniciativas?select=id,nombre,ciudad,oe,tipo,plazo,fase,responsable,descripcion&order=id');
      if(input.ciudad) d = d.filter(i=>norm(i.ciudad)===norm(input.ciudad));
      if(input.texto){ const ws = norm(input.texto).split(/\s+/).filter(w=>w.length>2);
        d = d.filter(i=>{ const h=norm(i.nombre+' '+i.descripcion+' '+i.tipo); return ws.some(w=>h.includes(w)); }); }
      return {total:d.length, iniciativas:d.slice(0,80)};
    }
    case 'listar_borradores':
      return BORR.map(b=>({id:b.id, nombre:b.nombre, estado:b.estado, oe:b.oe, ciudad:b.ciudad, plazo:b.plazo, fase:b.fase, actualiza_id:b.actualiza_id, faltantes:b.faltantes}));
    case 'crear_borrador': {
      const [b] = await sb('iniciativas_borrador',{method:'POST',body:JSON.stringify({...limpiar(input), sesion_id:SESION.id, creado_por:SESSION.email})});
      BORR.push(b); renderBorradores(); return {ok:true, id:b.id};
    }
    case 'actualizar_borrador': {
      const r = await sb(`iniciativas_borrador?id=eq.${encodeURIComponent(input.id)}&sesion_id=eq.${SESION.id}&estado=in.(borrador,lista)`,
        {method:'PATCH', body:JSON.stringify(limpiar(input))});
      if(!r?.length) return {ok:false, error:'No existe ese borrador en esta conversación o ya fue revisado.'};
      await cargarBorradores(); return {ok:true};
    }
    case 'eliminar_borrador': {
      const r = await sb(`iniciativas_borrador?id=eq.${encodeURIComponent(input.id)}&sesion_id=eq.${SESION.id}&estado=in.(borrador,lista)`,{method:'DELETE'});
      await cargarBorradores(); return {ok:!!r?.length};
    }
    case 'marcar_listos': {
      const ids = (input.ids||[]).map(encodeURIComponent).join(',');
      const r = await sb(`iniciativas_borrador?id=in.(${ids})&sesion_id=eq.${SESION.id}&estado=eq.borrador`,{method:'PATCH',body:JSON.stringify({estado:'lista'})});
      await cargarBorradores(); return {ok:true, marcados:r?.length||0};
    }
  }
  return {error:'Herramienta desconocida'};
}

async function llamarClaude(){
  const r = await fetch(CLAUDE_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:MODEL, max_tokens:4096, system:systemPrompt(), tools:TOOLS, messages:MSGS})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.error) throw new Error(d.error?.message || `Error ${r.status} del asistente`);
  return d;
}

async function enviar(){
  if(OCUPADO) return;
  const txt = $('inp').value.trim();
  if(!txt && !ADJ.length) return;
  OCUPADO = true; ERROR = null; $('send').disabled = true;
  try{
    if(!SESION){
      const titulo = (txt || ADJ.map(a=>a.nombre).join(', ')).slice(0,60);
      [SESION] = await sb('recopilador_sesiones',{method:'POST',body:JSON.stringify({titulo, creado_por:SESSION.email})});
      SESIONES.unshift(SESION); renderSesiones();
    }
    const content = [...ADJ.flatMap(a=>a.bloques)];
    if(txt) content.push({type:'text', text:txt});
    else content.push({type:'text', text:'Revisa estos archivos y ordena las iniciativas.'});
    MSGS.push({role:'user', content});
    $('inp').value=''; ADJ=[]; renderAdjuntos(); renderMsgs(true);

    for(let paso=0; paso<15; paso++){
      const d = await llamarClaude();
      MSGS.push({role:'assistant', content:d.content});
      renderMsgs(true);
      if(d.stop_reason !== 'tool_use') break;
      const resultados = [];
      for(const b of d.content.filter(b=>b.type==='tool_use')){
        let res;
        try{ res = await ejecutarTool(b.name, b.input||{}); }
        catch(e){ res = {error:e.message}; }
        resultados.push({type:'tool_result', tool_use_id:b.id, content:JSON.stringify(res)});
      }
      MSGS.push({role:'user', content:resultados});
      renderMsgs(true);
    }
  }catch(e){
    ERROR = e.message;   // se muestra pero no se agrega a la conversación que viaja a la API
  }
  try{ await guardarConversacion(); }catch(e){ toast('No se pudo guardar la conversación'); }
  OCUPADO = false; $('send').disabled = false; renderMsgs();
}
let ERROR = null;
$('inp').addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } });
$('inp').addEventListener('input',e=>{ e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,200)+'px'; });

const ETIQ_TOOL = {listar_iniciativas:'Revisó las iniciativas publicadas', listar_borradores:'Revisó los borradores',
  crear_borrador:'Creó borrador', actualizar_borrador:'Actualizó borrador', eliminar_borrador:'Eliminó borrador', marcar_listos:'Marcó como listos'};
function renderMsgs(pensando){
  const el = $('msgs');
  if(!MSGS.length){
    el.innerHTML = `<div class="vacio"><h2>¿Qué información tienes hoy?</h2>
      <p>Comparte planillas, PDF, documentos Word, fotos o pega texto. El asistente identifica las iniciativas,
      las ordena con los campos del portal (OE, ciudad, plazo, fase…) y te pregunta lo que falte.</p>
      <p>Nada se publica hasta que un administrador lo apruebe.</p></div>`;
    return;
  }
  let h='';
  for(const m of MSGS){
    const bl = typeof m.content==='string' ? [{type:'text',text:m.content}] : m.content;
    if(m.role==='user'){
      if(bl.every(b=>b.type==='tool_result')) continue;
      const adj = bl.filter(b=>b.type==='text' && b.text.startsWith('[[ADJUNTO:')).map(b=>b.text.match(/^\[\[ADJUNTO:(.+?)\]\]/)[1]);
      const txt = bl.filter(b=>b.type==='text' && !b.text.startsWith('[[ADJUNTO:') && !b.text.startsWith('[Archivo binario')).map(b=>b.text).join('\n');
      h += `<div class="msg u"><div class="bub">${adj.map(n=>`<span class="att">📄 ${esc(n)}</span>`).join('')}${txt?md(txt):''}</div></div>`;
    } else {
      let inner='';
      for(const b of bl){
        if(b.type==='text' && b.text.trim()) inner += md(b.text);
        if(b.type==='tool_use') inner += `<div class="tool">🔧 ${ETIQ_TOOL[b.name]||b.name}${b.input?.nombre?` <b>«${esc(b.input.nombre)}»</b>`:''}</div>`;
      }
      if(inner) h += `<div class="msg a"><div class="bub">${inner}</div></div>`;
    }
  }
  if(pensando && OCUPADO) h += `<div class="msg a"><div class="bub pensando">Ordenando la información…</div></div>`;
  if(ERROR && !OCUPADO) h += `<div class="msg a"><div class="bub" style="color:var(--bad)">⚠️ ${esc(ERROR)}. Puedes volver a enviar el mensaje.</div></div>`;
  el.innerHTML = h; el.scrollTop = el.scrollHeight;
}

// ── BORRADORES ──
async function cargarBorradores(){
  BORR = SESION ? await sb(`iniciativas_borrador?sesion_id=eq.${SESION.id}&order=created_at`) : [];
  renderBorradores();
}
function tarjeta(b, acciones){
  const oe = OE[b.oe];
  return `<div class="card">
    <div style="display:flex;gap:8px;align-items:flex-start"><h4>${esc(b.nombre)}</h4><span class="est ${b.estado}">${b.estado==='lista'?'lista para revisión':b.estado}</span></div>
    <div class="tags">
      ${oe?`<span class="tag oe" style="background:${oe.color}">${b.oe} · ${oe.label}</span>`:''}
      ${b.ciudad?`<span class="tag">${esc(b.ciudad)}</span>`:''}
      ${b.plazo?`<span class="tag">${esc(b.plazo)}</span>`:''}
      ${b.fase?`<span class="tag">${esc(b.fase)}</span>`:''}
      ${b.tipo?`<span class="tag">${esc(b.tipo)}</span>`:''}
      ${b.actualiza_id?`<span class="tag" style="background:#EFAD1B33">actualiza ${esc(b.actualiza_id)}</span>`:''}
    </div>
    ${b.descripcion?`<div class="desc">${esc(b.descripcion)}</div>`:''}
    ${b.responsable?`<div class="meta">Responsable: ${esc(b.responsable)}</div>`:''}
    ${b.faltantes?.length?`<div class="falta">Falta: ${b.faltantes.map(esc).join(' · ')}</div>`:''}
    ${b.notas?`<div class="meta">📝 ${esc(b.notas)}</div>`:''}
    ${b.fuente?`<div class="meta">Fuente: ${esc(b.fuente)}</div>`:''}
    <div class="acc">${acciones}</div></div>`;
}
function renderBorradores(){
  const el = $('borradores');
  const n = {borrador:0, lista:0}; BORR.forEach(b=>n[b.estado]=(n[b.estado]||0)+1);
  el.innerHTML = `<h3>Borradores <span>${BORR.length} · ${n.lista} listos</span>
      ${n.borrador?`<button class="sm" style="margin-left:auto" onclick="marcarTodos()">Marcar todos listos</button>`:''}</h3>` +
    (BORR.length ? BORR.map(b=>tarjeta(b, ['borrador','lista'].includes(b.estado) ? `
      <button class="sm" onclick="editar('${b.id}')">Editar</button>
      ${b.estado==='borrador'
        ? `<button class="sm pri" onclick="cambiarEstado('${b.id}','lista')">Marcar lista</button>`
        : `<button class="sm" onclick="cambiarEstado('${b.id}','borrador')">Volver a borrador</button>`}
      <button class="sm bad" onclick="borrar('${b.id}')">Eliminar</button>` : '')).join('')
    : `<p style="color:var(--mut);font-size:13px">Aquí aparecerán las iniciativas que el asistente vaya ordenando.</p>`);
}
async function cambiarEstado(id, estado){
  await sb('iniciativas_borrador?id=eq.'+id,{method:'PATCH',body:JSON.stringify({estado})});
  await cargarBorradores();
}
async function marcarTodos(){
  const pend = BORR.filter(b=>b.estado==='borrador');
  if(pend.some(b=>b.faltantes?.length) && !confirm('Algunos borradores aún tienen datos faltantes. ¿Marcarlos como listos igual?')) return;
  await sb(`iniciativas_borrador?sesion_id=eq.${SESION.id}&estado=eq.borrador`,{method:'PATCH',body:JSON.stringify({estado:'lista'})});
  await cargarBorradores();
}
async function borrar(id){
  if(!confirm('¿Eliminar este borrador?')) return;
  await sb('iniciativas_borrador?id=eq.'+id,{method:'DELETE'}); await cargarBorradores();
}

// Editor (lo usan la encargada y el admin en revisión)
function opciones(lista, val){ return `<option value=""></option>` + lista.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join(''); }
function editar(id, desdeRevision){
  const b = (desdeRevision ? REV : BORR).find(x=>x.id===id);
  $('modal').innerHTML = `<form onsubmit="guardarEdicion(event,'${id}',${!!desdeRevision})">
    <h3 style="margin:0 0 6px">Editar borrador</h3>
    <label>Nombre</label><input name="nombre" required value="${esc(b.nombre)}">
    <div class="g2">
      <div><label>Objetivo estratégico</label><select name="oe">${opciones(Object.keys(OE), b.oe)}</select></div>
      <div><label>Ciudad</label><select name="ciudad">${opciones(Object.keys(CIUDADES), b.ciudad)}</select></div>
      <div><label>Plazo</label><select name="plazo">${opciones(PLAZOS, b.plazo)}</select></div>
      <div><label>Fase</label><select name="fase">${opciones(FASES, b.fase)}</select></div>
      <div><label>Tipo</label><input name="tipo" value="${esc(b.tipo)}"></div>
      <div><label>Responsable</label><input name="responsable" value="${esc(b.responsable)}"></div>
      <div><label>Latitud</label><input name="lat" type="number" step="any" value="${b.lat??''}"></div>
      <div><label>Longitud</label><input name="lng" type="number" step="any" value="${b.lng??''}"></div>
    </div>
    <label>Descripción</label><textarea name="descripcion" rows="3">${esc(b.descripcion)}</textarea>
    <label>Datos faltantes (separados por coma)</label><input name="faltantes" value="${esc((b.faltantes||[]).join(', '))}">
    <label>Notas</label><textarea name="notas" rows="2">${esc(b.notas)}</textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button type="button" onclick="cerrarModal()">Cancelar</button><button class="pri">Guardar</button></div>
  </form>`;
  $('modal').classList.remove('hide');
}
function cerrarModal(){ $('modal').classList.add('hide'); $('modal').innerHTML=''; }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') cerrarModal(); });
async function guardarEdicion(e, id, desdeRevision){
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const datos = {...f, lat: f.lat===''?null:+f.lat, lng: f.lng===''?null:+f.lng,
    faltantes: f.faltantes.split(',').map(s=>s.trim()).filter(Boolean)};
  for(const k of ['oe','ciudad','plazo','fase','tipo','responsable','descripcion','notas']) if(datos[k]==='') datos[k]=null;
  await sb('iniciativas_borrador?id=eq.'+id,{method:'PATCH',body:JSON.stringify(datos)});
  cerrarModal(); toast('Borrador guardado');
  desdeRevision ? renderRevision() : cargarBorradores();
}

// ── REVISIÓN (solo admin) ──
let REV = [], PUBLICADAS = {};
async function renderRevision(){
  $('rev').innerHTML = '<p style="color:var(--mut)">Cargando…</p>';
  const [rev, pub] = await Promise.all([
    sb(`iniciativas_borrador?estado=eq.${REV_FILTRO}&order=updated_at.desc&limit=200`),
    sb('iniciativas?select=id,nombre,oe,ciudad,tipo,plazo,fase,responsable,descripcion,lat,lng')]);
  REV = rev; PUBLICADAS = Object.fromEntries(pub.map(i=>[i.id,i]));
  const filtros = [['lista','Por revisar'],['aprobada','Aprobadas'],['rechazada','Rechazadas'],['borrador','En borrador']];
  $('rev').innerHTML = `<h2 style="margin:0 0 4px">Revisión de borradores</h2>
    <p style="color:var(--mut);margin:0 0 14px">Al aprobar, la iniciativa se publica en el portal (tabla <code>iniciativas</code>).</p>
    <div class="filtros">${filtros.map(([k,t])=>`<button class="sm ${REV_FILTRO===k?'on':''}" onclick="REV_FILTRO='${k}';renderRevision()">${t}</button>`).join('')}</div>` +
    (REV.length ? REV.map(b=>tarjeta(b, (REV_FILTRO==='lista' ? `
        <button class="sm" onclick="editar('${b.id}',true)">Editar</button>
        <button class="sm ok" onclick="aprobar('${b.id}')">Aprobar y publicar</button>
        <button class="sm bad" onclick="rechazar('${b.id}')">Rechazar</button>` : '')
      + `<span class="meta" style="margin-left:auto">${esc(b.creado_por||'')}${b.publicado_id?` · publicada como ${esc(b.publicado_id)}`:''}</span>`)
      .replace('<div class="acc">', diffHtml(b)+'<div class="acc">')).join('')
    : `<p style="color:var(--mut)">No hay borradores en este estado.</p>`);
}
function diffHtml(b){
  const p = b.actualiza_id && PUBLICADAS[b.actualiza_id];
  if(!p) return '';
  const filas = CAMPOS.filter(k=>b[k]!=null && b[k]!=='' && String(b[k])!==String(p[k] ?? ''))
    .map(k=>`<div><b>${k}:</b> <del>${esc(p[k] ?? '—')}</del> → <ins>${esc(b[k])}</ins></div>`);
  return `<div class="diff">Cambios sobre «${esc(p.nombre)}» (${esc(p.id)}):${filas.join('') || ' <i>sin cambios</i>'}</div>`;
}
function siguienteId(ciudad){
  const pre = CIUDADES[ciudad]?.p || 'x';
  const nums = Object.keys(PUBLICADAS).filter(id=>new RegExp('^'+pre+'\\d+$').test(id)).map(id=>+id.slice(pre.length));
  return pre + ((nums.length ? Math.max(...nums) : 0) + 1);
}
async function aprobar(id){
  const b = REV.find(x=>x.id===id);
  const p = b.actualiza_id && PUBLICADAS[b.actualiza_id];
  if(b.actualiza_id && !p) return toast(`La iniciativa ${b.actualiza_id} ya no existe en el portal`);
  if(!p){
    const falta = ['oe','ciudad','plazo','fase','descripcion'].filter(k=>!b[k]);
    if(falta.length) return toast('Antes de publicar completa: '+falta.join(', '));
  }
  let pubId;
  if(p){
    const cambios = {}; for(const k of CAMPOS) if(b[k]!=null && b[k]!=='') cambios[k]=b[k];
    if(!confirm(`¿Actualizar «${p.nombre}» en el portal?`)) return;
    await sb('iniciativas?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify(cambios)});
    pubId = p.id;
  } else {
    pubId = siguienteId(b.ciudad);
    const c = CIUDADES[b.ciudad] || {};
    const sinCoords = b.lat==null || b.lng==null;
    if(!confirm(`¿Publicar «${b.nombre}» como ${pubId}?${sinCoords?'\nNo tiene coordenadas: se ubicará en el centro de '+b.ciudad+'.':''}`)) return;
    await sb('iniciativas',{method:'POST',body:JSON.stringify({id:pubId, nombre:b.nombre, oe:b.oe, ciudad:b.ciudad,
      lat:b.lat ?? c.lat ?? null, lng:b.lng ?? c.lng ?? null, tipo:b.tipo, plazo:b.plazo, responsable:b.responsable,
      descripcion:b.descripcion, fase:b.fase})});
  }
  await sb('iniciativas_borrador?id=eq.'+id,{method:'PATCH',body:JSON.stringify({estado:'aprobada', revisado_por:SESSION.email, publicado_id:pubId})});
  toast(`Publicada como ${pubId}`); renderRevision();
}
async function rechazar(id){
  const motivo = prompt('Motivo del rechazo (lo verá la encargada):');
  if(motivo===null) return;
  const b = REV.find(x=>x.id===id);
  await sb('iniciativas_borrador?id=eq.'+id,{method:'PATCH',body:JSON.stringify({estado:'rechazada', revisado_por:SESSION.email,
    notas:[b.notas, motivo && 'Rechazo: '+motivo].filter(Boolean).join('\n')})});
  toast('Borrador rechazado'); renderRevision();
}

// ── INICIO ──
try{ SESSION = JSON.parse(localStorage.getItem('emra_recop')); }catch(e){}
if(SESSION) entrar().catch(()=>{ guardarSesion(null); location.reload(); });
