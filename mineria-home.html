<!DOCTYPE html>
<!-- Conoce sobre minería · widget para el home de emra.cl (iframe).
     Muestra datos y preguntas al azar de "Minería en Números" y lleva a emra.cl/datos-sobre-mineria/.
     Datos compartidos con mineria.html vía mineria-datos.js. Avisa su alto al sitio padre (postMessage). -->
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Conoce sobre minería</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--tx:#383838;--mut:#6f6a66;--bg:#ffffff;--card:#f7f1ec;--bd:#e8ddd4;--cu:#CC824D;--cu2:#b36c3a;--ok:#1f9d6b;--no:#d4553f;--e:#038FCF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font-family:'Figtree',-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.w{max-width:1120px;margin:0 auto;padding:8px 16px 16px}
.head{text-align:center;margin-bottom:26px}
.kick{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cu)}
h2{font-size:clamp(30px,4.6vw,46px);font-weight:800;line-height:1.1;margin-top:6px;letter-spacing:-.01em}
.head p{color:var(--mut);margin-top:8px;font-size:17px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.lab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 0}
.lab b{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cu2)}
.mini{background:transparent;border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tx);transition:.15s;white-space:nowrap}
.mini:hover{border-color:var(--cu);color:var(--cu2)}
/* dato */
.fig{position:relative;aspect-ratio:16/8;margin:14px 20px 0;border-radius:10px;overflow:hidden;background:#e9dfd6}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.fig figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;font-size:11px;line-height:1.3;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.fig figcaption a{color:#fff}
.fbody{padding:16px 20px 20px;flex:1;display:flex;flex-direction:column}
.num{font-size:clamp(40px,5.4vw,56px);font-weight:800;color:var(--cu);line-height:1}
.txt{font-size:17px;margin-top:10px;flex:1}
.src{font-size:12px;color:var(--mut);margin-top:12px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--bd)}
.dots i.on{background:var(--cu)}
/* pregunta */
.qbody{padding:16px 20px 20px;flex:1;display:flex;flex-direction:column}
.q{font-size:clamp(20px,2.4vw,24px);font-weight:700;line-height:1.25;margin-bottom:16px}
.ops{display:grid;gap:9px}
.op{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;text-align:left;font-size:16px;font-weight:600;color:var(--tx);transition:.15s}
.op:hover:not(:disabled){border-color:var(--cu)}
.op.ok{border-color:var(--ok);background:#e9f7f0}
.op.no{border-color:var(--no);background:#fbece8}
.op:disabled{cursor:default}
.exp{margin-top:14px;font-size:15px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--bd);display:none}
.exp.show{display:block}
.score{font-size:13px;color:var(--mut);font-weight:600}
/* cta */
.cta{text-align:center;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--cu);color:#fff;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:15px 28px;border-radius:3px;transition:.15s}
.btn:hover{background:var(--cu2)}
.cta p{font-size:12px;color:var(--mut);margin-top:12px}
:focus-visible{outline:2px solid var(--e);outline-offset:2px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
  <div class="head">
    <div class="kick">Minería en números</div>
    <h2>Conoce sobre minería</h2>
    <p>Datos sorprendentes y una pregunta para poner a prueba lo que sabes.</p>
  </div>

  <div class="grid">
    <section class="card" aria-label="Dato al azar">
      <div class="lab"><b>¿Sabías que…?</b><button class="mini" id="otro-dato">Otro dato ↻</button></div>
      <div id="dato" aria-live="polite"></div>
    </section>

    <section class="card" aria-label="Pregunta al azar">
      <div class="lab"><b>Pon a prueba lo que sabes</b><span class="score" id="score"></span></div>
      <div class="qbody" id="preg"></div>
    </section>
  </div>

  <div class="cta">
    <a class="btn" href="https://www.emra.cl/datos-sobre-mineria/" target="_top">Ver todos los datos sobre minería →</a>
    <p>Fuente: libro <i>Minería en Números</i>, 8ª edición, Consejo Minero (2025).</p>
  </div>
</div>

<script src="mineria-datos.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function fig(k){
  if(FOTOS[k]){const [c,a,l,u]=FOTOS[k];return `<figure class="fig"><img src="mineria-img/${k}.jpg" alt="${esc(c)}" loading="lazy"/><figcaption>${esc(c)} · Foto: <a href="${u}" target="_blank" rel="noopener">${esc(a)}, ${esc(l)}</a></figcaption></figure>`;}
  if(ILUS[k])return `<figure class="fig"><img src="mineria-img/ia-${k}.jpg" alt="${esc(ILUS[k])}" loading="lazy"/><figcaption>${esc(ILUS[k])} · Ilustración generada con IA</figcaption></figure>`;
  return '';
}

// ── Dato al azar: solo los que tienen imagen, sin repetir hasta recorrerlos todos; rota solo cada 10 s ──
const CON_IMG=DATA.filter(d=>d.img);
let mazo=shuffle(CON_IMG),di=0,timer=null;
function mostrarDato(){
  if(di>=mazo.length){mazo=shuffle(CON_IMG);di=0;}
  const d=mazo[di++];
  $('#dato').innerHTML=`<div class="fade">${fig(d.img)}<div class="fbody"><div class="num">${esc(d.n)}</div><p class="txt">${esc(d.d)}</p><p class="src">Fuente: ${esc(d.s)} · Minería en Números, p.${d.p}</p></div></div>`;
}
function programar(){
  clearTimeout(timer);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  timer=setTimeout(()=>{if(!document.hidden&&!pausa)mostrarDato();programar();},10000);
}
let pausa=false;
$('#dato').parentElement.addEventListener('mouseenter',()=>pausa=true);
$('#dato').parentElement.addEventListener('mouseleave',()=>pausa=false);
$('#otro-dato').onclick=()=>{mostrarDato();programar();};

// ── Pregunta al azar (QUIZ: [pregunta, opciones (1ª correcta), explicación, página, imagen, spoiler]) ──
let qmazo=shuffle(QUIZ),qi=0,ok=0,tot=0;
function mostrarPregunta(){
  if(qi>=qmazo.length){qmazo=shuffle(QUIZ);qi=0;}
  const [q,ops,exp,p]=qmazo[qi++],correcta=ops[0];
  $('#preg').innerHTML=`<div class="fade"><p class="q">${esc(q)}</p><div class="ops">${shuffle(ops).map(o=>`<button class="op">${esc(o)}</button>`).join('')}</div>
    <div class="exp" id="exp" aria-live="polite"></div></div>`;
  $('#preg').querySelectorAll('.op').forEach(b=>b.onclick=()=>{
    const bien=b.textContent===correcta;tot++;if(bien)ok++;
    $('#preg').querySelectorAll('.op').forEach(x=>{x.disabled=true;if(x.textContent===correcta)x.classList.add('ok');});
    if(!bien)b.classList.add('no');
    const e=$('#exp');e.innerHTML=`<b>${bien?'✅ ¡Correcto!':'❌ No era esa.'}</b> ${esc(exp)} <span class="src">(Minería en Números, p.${p})</span>
      <div style="margin-top:12px"><button class="mini" id="otra">Otra pregunta →</button></div>`;
    e.classList.add('show');
    $('#score').textContent=`${ok} de ${tot} correctas`;
    $('#otra').onclick=mostrarPregunta;
  });
}

mostrarDato();programar();mostrarPregunta();

// ── iframe: avisar alto al sitio padre (lo usa mineria-embed.js) ──
if(parent!==window){
  let lastH=0;
  const send=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==lastH){lastH=h;parent.postMessage({type:'emra-mineria-height',h},'*');}};
  new ResizeObserver(send).observe(document.body);send();
}
</script>
</body>
</html>
